name: CI

# Everything here runs on a clean checkout with NO secrets. Build, test, fuzz,
# analysis and the circuit path never read .env — only deploying and seeding need
# credentials, and neither happens in CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # PIGFOX SOLIDITY PIPELINE v1 — the estate's one verification standard, defined
  # once in pigfox/solidity-pipeline and consumed here rather than copied. It
  # replaces the hand-written no-chain-copy, fmt, forge and slither jobs this file
  # used to carry, and it ADDS the two stages that were missing: Medusa, and the
  # property-count assertion. This repo had an echidna.yaml but no CI job running
  # it, so the property fuzzing was opt-in on a laptop.
  #
  # The gate SCRIPTS come from lib/solidity-pipeline, vendored as a submodule at a
  # commit this repo pins, so a local run and this run are the same bytes.
  #
  # https://github.com/pigfox/solidity-pipeline
  pipeline:
    uses: pigfox/solidity-pipeline/.github/workflows/solidity.yml@v1
    with:
      # test/Properties.sol declares four echidna_* predicates and states the same
      # number in pigfoxPropertyCount(). Both fuzzers assert they registered
      # exactly this many, so a property that silently stops being picked up fails
      # the job instead of reporting a smaller green run.
      #
      # Bump this, pigfoxPropertyCount() and the predicate together, in one commit.
      expected-properties: 4

      # src/Verifier.sol is generated verbatim by snarkjs from the proving key.
      # Its residual uncovered lines are the inline-assembly early exits taken
      # when the BN254 precompiles themselves report failure, which cannot be
      # provoked from a test. Excluded BY NAME — the gate prints it as SKIP — and
      # the verifier is still exercised end-to-end by real Groth16 proofs in
      # test/RealProof.t.sol. See the pipeline's docs/ADOPTING.md.
      coverage-exclusions: src/Verifier.sol

  # ---------------------------------------------------------------------------
  # Repo-specific, and deliberately NOT in the shared pipeline: the pipeline
  # covers Solidity, and does not try to be everything.
  circuit:
    name: circuit (circom compile + snarkjs circuit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 20

      - name: Install circom
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v2.2.2/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version

      - name: npm ci
        run: npm ci

      - name: Compile circuit
        run: |
          set -euo pipefail
          mkdir -p /tmp/circuit-out
          circom circuits/kycpass.circom --r1cs --wasm --sym \
            -l node_modules/circomlib/circuits -o /tmp/circuit-out

      # Drives the checked-in zkey/wasm/vkey through snarkjs: valid proof
      # verifies; wrong secret/root cannot witness; tampered nullifier and
      # cross-address proofs are rejected.
      - name: Circuit tests
        run: node --test test/circuit/

  # ---------------------------------------------------------------------------
  go:
    name: go kycctl (vet, test, 100% coverage gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.1.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          set -euo pipefail
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "::error::gofmt: $out"; exit 1; fi

      - name: Test with coverage
        run: go test ./... -covermode=set -coverprofile=coverage.out

      - name: Coverage gate (100.0% statements)
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tail -20
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "::error::Go coverage is $total, required 100.0%"
            go tool cover -func=coverage.out | awk '$NF != "100.0%" && !/^total:/'
            exit 1
          fi
