[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

# crytic-compile (Echidna, Medusa, Slither) consumes these artifacts via
# --foundry-ignore-compile / --ignore-compile, so it never needs its own solc.
build_info = true
extra_output = ["storageLayout"]

remappings = [
    "forge-std/=lib/forge-std/src/",
    # PIGFOX SOLIDITY PIPELINE v1, vendored as a submodule. The shared property
    # base lives here; the gate scripts alongside it are what CI runs, so a local
    # run and a CI run are the same bytes.
    "pipeline/=lib/solidity-pipeline/src/",
]

# Tests read the checked-in fixture proofs; nothing else touches the filesystem.
fs_permissions = [{access = "read", path = "./test/fixtures"}]

# --- forge lint ------------------------------------------------------------
# CANONICAL BLOCK. Copied verbatim from lib/solidity-pipeline/config/lint.toml
# and held in agreement with it by scripts/lint-config-check.sh, which CI runs.
# `forge lint` has no --config-file, so unlike Slither and Solhint this cannot be
# consumed from the submodule; it is the same deliberate copy as echidna.yaml and
# medusa.json, with the same check keeping the copies honest.
# Every exclusion's reasoning is in lib/solidity-pipeline/docs/forge-lint-rules.md.
#
# src/Verifier.sol is the documented per-repo addition: generated verbatim by
# snarkjs, so its naming and layout are not ours to change and regenerating would
# reintroduce any edit.
[lint]
ignore = ["test/**/*.sol", "script/**/*.sol", "src/Verifier.sol"]
exclude_lints = [
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "unwrapped-modifier-logic",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
# depth intentionally matches seqLen in echidna.yaml and callSequenceLength in
# medusa.json, so all three engines walk sequences of the same length and a bug
# found by one is reachable by the rest.
depth = 64
# Every harness entry point swallows its expected reverts by design, so a revert
# surfacing here is a harness bug — not a protocol finding — and must fail loud
# rather than silently shrinking the effective search space.
fail_on_revert = true

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 512
depth = 96

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
# Same reasoning as [lint]: that ignore applies to the linter only. int_types =
# "long" would rewrite the generated verifier's `uint[2] calldata` to
# `uint256[2] calldata` — a real token change to snarkjs output that must stay
# byte-identical to what the circuit build produces.
ignore = ["src/Verifier.sol"]
